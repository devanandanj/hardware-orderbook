name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: spec generator + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generated files are current
        run: python spec/gen.py --check

      - name: Spec self-tests
        run: python spec/test_spec.py

  formal:
    name: SymbiYosys book properties
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v4
      - run: make -C formal prove cover

  order_table:
    name: order table vs golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: make -C tb/order_table

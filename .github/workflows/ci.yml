name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: spec generator + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generated files are current
        run: |
          python spec/gen.py --check
          python spec/gen.py --check --book formal/book_small.yaml --outdir formal/generated

      - name: Spec self-tests
        run: python spec/test_spec.py

  formal:
    name: SymbiYosys book properties
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: '2026-10-25'   # the build formal/ was checked with locally
      - run: make -C formal prove cover

  rtl_units:
    name: RTL blocks vs golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: make -C tb/order_table
      - run: make -C tb/price_slot
      - run: make -C tb/price_book
      - run: make -C tb/book

  verilog:
    name: generated Verilog for ISE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y verilator iverilog
      - name: Install sv2v
        run: |
          curl -fsSL -o sv2v.zip https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip
          unzip -q sv2v.zip
          echo "$PWD/sv2v-Linux" >> "$GITHUB_PATH"
      - run: make -C synth check

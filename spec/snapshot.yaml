# FPGA -> host book snapshot, carried as UDP payload.
#
# Fixed size, big-endian. Fixed size is deliberate: the RTL serializer
# becomes a register file plus a byte counter with no variable-length state
# machine, and the host side becomes a single struct.unpack.
#
# UDP already supplies framing, length, and a checksum, so this format
# carries no SYNC word, no length field, and no CRC. (The earlier
# uart-trace-decoder format needed all three because a raw UART byte stream
# supplies none of them.)
#
# Version 3: ONE packet per BOOK message carrying the best bid and offer.
# Book messages are types A F E C X D U for the selected symbol (stock
# locate). Every other message -- other types, other symbols -- produces
# NO packet. msg_index still counts every ITCH message in the stream, so
# skipped messages show as gaps in msg_index.
#
# The book now holds thousands of orders, so per-message full depth no
# longer fits on the wire; deep-book correctness is checked in simulation
# by comparing the RTL's book memories against the golden model, and the
# wire carries only what the host and the strategy consume.
#
# These bytes are still a verification trace: the golden model emits the
# identical packet stream, and the scoreboard byte-diffs it.

byte_order: big

magic: 0x4F42        # "OB"
version: 3           # 3: one BBO packet per message (2: per-side full depth)

packet:
  length: 48
  fields:
    - { name: magic,      offset:  0, width: 2, type: uint }
    - { name: version,    offset:  2, width: 1, type: uint }
    - { name: status,     offset:  3, width: 1, type: uint }
    - { name: snap_seq,   offset:  4, width: 4, type: uint }
    - { name: mold_seq,   offset:  8, width: 8, type: uint }
    - { name: msg_index,  offset: 16, width: 4, type: uint }
    - { name: t_arrive,   offset: 20, width: 4, type: uint }
    - { name: t_commit,   offset: 24, width: 4, type: uint }
    - { name: bid_price,  offset: 28, width: 4, type: uint }  # 0 when no bids
    - { name: bid_shares, offset: 32, width: 4, type: uint }
    - { name: ask_price,  offset: 36, width: 4, type: uint }  # 0 when no asks
    - { name: ask_shares, offset: 40, width: 4, type: uint }
    - { name: bid_orders, offset: 44, width: 2, type: uint }  # orders at best bid
    - { name: ask_orders, offset: 46, width: 2, type: uint }

# Message-level outcome of the ITCH message this packet follows. Bits 2 and 3
# keep their v2 positions.
status_bits:
  - { name: order_dropped,     bit: 0, comment: add found its set and the CAM full; order not stored }
  - { name: price_rejected,    bit: 1, comment: add price off-tick or outside the price window; order not stored }
  - { name: mold_gap_seen,     bit: 2, comment: sticky; a MoldUDP64 sequence gap was observed }
  - { name: unknown_order_ref, bit: 3, comment: last D/U/E/C/X referenced an order not in the book }

# Fields excluded from the RTL-vs-model byte diff. The cycle counters are
# hardware-only timing data with no software equivalent; the scoreboard
# masks them before comparing.
diff_masked_fields:
  - t_arrive
  - t_commit

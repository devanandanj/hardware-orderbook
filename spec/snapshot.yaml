# FPGA -> host book snapshot, carried as a UDP payload.
#
# Fixed size, big-endian. Fixed size is deliberate: the RTL serializer
# becomes a register file plus a byte counter with no variable-length state
# machine, and the host side becomes a single struct.unpack.
#
# UDP already supplies framing, length, and a checksum, so this format
# carries no SYNC word, no length field, and no CRC. (The earlier
# uart-trace-decoder format needed all three because a raw UART byte stream
# supplies none of them.)
#
# One snapshot is emitted per processed ITCH message. These bytes ARE the
# verification trace: the golden model emits the identical format, and the
# scoreboard is a byte diff.

byte_order: big

magic: 0x4F42        # "OB"
version: 1

max_orders_per_side: 32   # must equal MAX_ORDERS_PER_SIDE in the golden model

header:
  length: 32
  fields:
    - { name: magic,      offset:  0, width: 2, type: uint }
    - { name: version,    offset:  2, width: 1, type: uint }
    - { name: status,     offset:  3, width: 1, type: uint }
    - { name: snap_seq,   offset:  4, width: 4, type: uint }
    - { name: mold_seq,   offset:  8, width: 8, type: uint }
    - { name: msg_index,  offset: 16, width: 4, type: uint }
    - { name: t_arrive,   offset: 20, width: 4, type: uint }
    - { name: t_commit,   offset: 24, width: 4, type: uint }
    - { name: bid_count,  offset: 28, width: 1, type: uint }
    - { name: ask_count,  offset: 29, width: 1, type: uint }
    - { name: reserved,   offset: 30, width: 2, type: uint }

# One resting order. Field order matches snapshot_format.yaml from
# moldudp-scapy so the existing StructUnpacker needs minimal change.
level:
  length: 16
  fields:
    - { name: price,     offset:  0, width: 4, type: uint }
    - { name: quantity,  offset:  4, width: 4, type: uint }
    - { name: order_id,  offset:  8, width: 8, type: uint }

# Body layout: all 32 bid slots, then all 32 ask slots. Slots at or beyond
# the corresponding count are zero-filled.
body:
  - { name: bids, count_field: bid_count }
  - { name: asks, count_field: ask_count }

# Entries within a side are sorted ascending by order_id. This matches
# Orderbook-cpp/include/trace.h::SortSide and makes the snapshot independent
# of whichever internal slot layout the RTL or the model happens to use.
sort_key: order_id
sort_order: ascending

status_bits:
  - { name: book_full_bid,     bit: 0, comment: bid side at capacity }
  - { name: book_full_ask,     bit: 1, comment: ask side at capacity }
  - { name: mold_gap_seen,     bit: 2, comment: sticky; a MoldUDP64 sequence gap was observed }
  - { name: unknown_order_ref, bit: 3, comment: last D/U/E referenced an order not in the book }

# Fields excluded from the RTL-vs-model byte diff. The cycle counters are
# hardware-only timing data with no software equivalent; the scoreboard
# masks them before comparing.
diff_masked_fields:
  - t_arrive
  - t_commit
